<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bramblelight Studio · The Office</title>
<style>
  @font-face { font-family:'Silkscreen'; src:url(../game/fonts/Silkscreen-Regular.woff2) format('woff2'); font-display:swap; }
  @font-face { font-family:'VT323'; src:url(../game/fonts/VT323-Regular.woff2) format('woff2'); font-display:swap; }
  :root { --bg:#120e1f; --panel:#1c1630; --edge:#3a2f5a; --ink:#efe6ff; --dim:#9d8fc4; --pink:#ff6fa8; --teal:#5fe0c8; --amber:#ffc46b; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family:'VT323', monospace; font-size:20px; }
  body { min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:18px 14px 28px; gap:14px;
         background: radial-gradient(1200px 500px at 50% -10%, #2a1f48 0%, var(--bg) 60%); }
  header { width:min(1280px,100%); display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  h1 { font-family:'Silkscreen', monospace; font-size:26px; margin:0; letter-spacing:1px;
       color:var(--pink); text-shadow:0 0 12px #ff6fa866, 0 0 2px #fff4; }
  h1 small { color:var(--teal); font-size:15px; text-shadow:none; margin-left:8px; }
  .meta { color:var(--dim); font-size:19px; }
  .meta b { color:var(--amber); font-weight:normal; }
  main { width:min(1280px,100%); display:grid; grid-template-columns: 1fr 320px; gap:14px; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
  .stage { align-self:start; position:relative; background:#000; border:3px solid var(--edge); box-shadow: 0 0 0 3px #0a0814, 0 18px 40px #0008; }
  canvas { display:block; width:100%; height:auto; image-rendering:pixelated; image-rendering:crisp-edges; cursor:default; }
  .tip { position:absolute; pointer-events:none; background:#0d0a18ee; border:2px solid var(--edge); padding:4px 8px; font-size:18px;
         transform:translate(-50%,-100%); white-space:nowrap; display:none; }
  .tip b { font-family:'Silkscreen'; font-size:13px; color:var(--teal); font-weight:normal; }
  aside { display:flex; flex-direction:column; gap:10px; }
  .card { background:var(--panel); border:2px solid var(--edge); padding:8px 10px; display:grid; grid-template-columns:48px 1fr; gap:10px; align-items:start; }
  .card canvas { width:48px; height:48px; background:#241c3d; border:2px solid #2e2550; }
  .card .name { font-family:'Silkscreen'; font-size:14px; }
  .card .role { color:var(--dim); font-size:17px; line-height:1; }
  .card .task { font-size:18px; line-height:1.05; margin-top:4px; }
  .pill { display:inline-block; font-family:'Silkscreen'; font-size:10px; padding:1px 5px; margin-left:6px; vertical-align:2px; border:1px solid; }
  .working { color:var(--teal); } .idle { color:var(--amber); } .done { color:#8dff7a; } .offline { color:#6d628f; }
  .log { background:var(--panel); border:2px solid var(--edge); padding:8px 10px; font-size:17px; line-height:1.1; max-height:260px; overflow:auto; }
  .log h3 { font-family:'Silkscreen'; font-size:13px; margin:0 0 6px; color:var(--pink); font-weight:normal; }
  .log div { color:var(--dim); } .log div:first-of-type { color:var(--ink); }
  footer { color:#6d628f; font-size:17px; }
</style>
</head>
<body>
<header>
  <h1>BRAMBLELIGHT STUDIO <small>the office · night shift</small></h1>
  <div class="meta">Now making <b id="proj">…</b> · phase <b id="phase">…</b> · wallet <b id="wallet">…</b> · <span id="clock"></span></div>
</header>
<main>
  <div class="stage">
    <canvas id="c" width="320" height="180"></canvas>
    <div class="tip" id="tip"></div>
  </div>
  <aside>
    <div id="cards"></div>
    <div class="log"><h3>STUDIO LOG</h3><div id="log"></div></div>
  </aside>
</main>
<footer>Hover a desk to see who works there. The office updates itself as the team works.</footer>
<script src="status.js"></script>
<script src="office.js"></script>
</body>
</html>
